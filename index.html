<body class="tab-wall">
<main class="page">
  <header class="panel hdr">
    <h1 class="logo">GAME CLUB</h1>
    <div class="tagline">★ like book club but for games ★</div>
    <nav class="nav" id="nav"></nav>
  </header>

  <div class="ticker" aria-label="Stupid but true game facts"><div class="lbl">GAME FACTS</div><div class="run"><span id="facts">Loading the news...</span></div></div>

  <div class="cols">
    <section class="panel wall" aria-label="Game wall">
      <div class="lightbox"><h2>GAME PICKS!</h2><span class="rnd" id="round-badge">Under 8 hrs</span></div>
      <div class="budget" id="budget"></div>
      <div class="cabinet">
        <div class="glass"><div class="items" id="shelf"></div></div>
        <div class="base"><span class="assoc">Please ask a club member for assistance</span><span class="lock" aria-hidden="true"></span></div>
      </div>
      <div class="bin-row">
        <div class="bin" id="bin"><span class="lbl">RETURN BUCKET</span></div>
      </div>
    </section>

    <aside class="im" aria-label="Chat room">
      <div class="win">
        <div class="tbar"><span class="ico">✦</span><span class="t">Game Club Chat Room</span></div>
        <div class="menu" id="chat-menu"></div>
        <div class="here glit" id="here"></div>
        <div class="chatlog glit" id="chatlog" aria-live="polite"></div>
        <div id="chat-send"></div>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <span class="star">★</span>
    <span class="badge">Best viewed in 1024x768</span>
    <span class="badge">Made w/ Notepad</span>
    <span class="badge">Game data: Steam</span>
    <span>Photos: RDNE Stock project (Pexels), A Chosen Soul (Unsplash)</span>
    <span class="star">★</span>
  </footer>
</main>

<nav class="mtabs" id="mtabs">
  <button type="button" class="on" data-tab="wall">🎮 Wall</button>
  <button type="button" data-tab="chat">💬 Chat<b id="unread" hidden>0</b></button>
</nav>

<div id="layer"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
